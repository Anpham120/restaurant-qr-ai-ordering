name: ${COMPOSE_PROJECT_NAME:-cmc-restaurant}

x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
  ASPNETCORE_URLS: http://127.0.0.1:${BACKEND_PORT:-5000}
  ConnectionStrings__DefaultConnection: Host=127.0.0.1;Port=${POSTGRES_PORT:-5432};Database=${POSTGRES_DB:-restaurant_qr};Username=${POSTGRES_USER:-restaurant_user};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required};Pooling=true;Minimum Pool Size=${DB_MIN_POOL_SIZE:-2};Maximum Pool Size=${DB_MAX_POOL_SIZE:-50}
  RUN_DB_MIGRATIONS_ON_STARTUP: ${RUN_DB_MIGRATIONS_ON_STARTUP:-false}
  BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
  SEED_DEMO_USERS: ${SEED_DEMO_USERS:-false}
  DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-}
  DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
  DEMO_COUNTER_EMAIL: ${DEMO_COUNTER_EMAIL:-}
  DEMO_COUNTER_PASSWORD: ${DEMO_COUNTER_PASSWORD:-}
  DEMO_STAFF_EMAIL: ${DEMO_STAFF_EMAIL:-}
  DEMO_STAFF_PASSWORD: ${DEMO_STAFF_PASSWORD:-}
  DEMO_KITCHEN_EMAIL: ${DEMO_KITCHEN_EMAIL:-}
  DEMO_KITCHEN_PASSWORD: ${DEMO_KITCHEN_PASSWORD:-}
  Jwt__Issuer: ${JWT_ISSUER:-RestaurantQrAiOrdering}
  Jwt__Audience: ${JWT_AUDIENCE:-RestaurantQrAiOrdering.Client}
  Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}
  Jwt__AccessTokenMinutes: ${JWT_ACCESS_TOKEN_MINUTES:-60}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
  Payments__VietQr__BankId: ${PAYMENTS__VIETQR__BANKID:?PAYMENTS__VIETQR__BANKID is required}
  Payments__VietQr__AccountNumber: ${PAYMENTS__VIETQR__ACCOUNTNUMBER:?PAYMENTS__VIETQR__ACCOUNTNUMBER is required}
  Payments__VietQr__AccountName: "${PAYMENTS__VIETQR__ACCOUNTNAME:?PAYMENTS__VIETQR__ACCOUNTNAME is required}"
  Payments__VietQr__Template: ${PAYMENTS__VIETQR__TEMPLATE:-compact2}
  CHAT_AI_PROVIDER: ${CHAT_AI_PROVIDER:-python-rag}
  AI_SERVICE_URL: ${AI_SERVICE_URL:-http://127.0.0.1:${AI_SERVICE_PORT:-8001}}
  AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?AI_INTERNAL_TOKEN is required}
  # KHÔNG đặt biến này. Backend `ReadPipelineProfile()` chỉ nhận đúng ba giá trị
  # (`llm_first_v1`, `evidence_first_v2`, `planner_state_v3`) và NÉM LỖI với mọi giá trị khác;
  # để trống thì nó tự dùng `llm_first_v1`.
  #
  # Tôi từng ghi ở đây rằng biến này "chỉ để ghi log" rồi đặt nó thành `rebuild-1`. Điều đó SAI:
  # backend kiểm nó theo danh sách cho phép, nên mọi lượt chat trả **500 Unhandled API
  # exception**. Chạy thật mới thấy — đọc mã thì tôi đã đọc đúng dòng ghi log và bỏ qua dòng kiểm.
  #
  # Dịch vụ AI không đọc biến này: bản dựng lại có đúng một đường xử lý thay vì 8 đường chồng
  # nhau, nên không có "profile" nào để chọn.
  # Keep the browser-facing API alive slightly longer than the AI service's
  # end-to-end request budget.  Otherwise a valid DeepSeek/Luna response can
  # be discarded by the backend before the AI service returns it.
  BACKEND_AI_TIMEOUT_SECONDS: ${BACKEND_AI_TIMEOUT_SECONDS:-50}
  AI_MAX_RETRY: ${AI_MAX_RETRY:-0}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-restaurant_qr}
      POSTGRES_USER: ${POSTGRES_USER:-restaurant_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    image: ${BACKEND_IMAGE:-cmc-restaurant-api:${DEPLOY_ENV:-local}}
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    network_mode: host
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${BACKEND_PORT:-5000}/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  migrate:
    image: ${BACKEND_IMAGE:-cmc-restaurant-api:${DEPLOY_ENV:-local}}
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: "no"
    command: ["--migrate-only"]
    environment:
      <<: *api-environment
      RUN_DB_MIGRATIONS_ON_STARTUP: "false"
    depends_on:
      postgres:
        condition: service_healthy
    network_mode: host
    profiles: ["migrate"]

  ai-service:
    image: ${AI_SERVICE_IMAGE:-cmc-restaurant-ai:${DEPLOY_ENV:-local}}
    build:
      context: ..
      dockerfile: ai/Dockerfile
    restart: unless-stopped
    # Chỉ những biến dịch vụ THẬT SỰ đọc.
    # ----------------------------------
    # Khối này từng truyền 11 biến mà bản dựng lại không đọc, và ba trong số đó NÓI SAI về hệ thống:
    #
    #     RAG_RETRIEVAL_METHOD: hybrid        bộ truy hồi thật là `embedding`, và nó do
    #                                         `requirements.txt` quyết định — không biến nào chọn
    #     RAG_KNOWLEDGE_BASE_PATH: knowledge-base   thư mục đó KHÔNG CÒN TỒN TẠI (nay `ai/knowledge`)
    #     AI_LLM_FIRST: true                  không còn khái niệm "gọi mô hình trước"
    #
    # Người vận hành đọc compose để biết hệ thống chạy thế nào. Một tệp cấu hình nói sai còn tệ hơn
    # không nói: nó ĐƯỢC TIN. Ai đọc dòng `RAG_RETRIEVAL_METHOD: hybrid` sẽ kết luận triển khai đang
    # chạy hybrid, trong khi kết luận trung tâm của phép đo là embedding (Hit@1 niêm phong 0,609 so
    # với 0,522 của hybrid) — và sẽ đi sửa biến đó khi muốn đổi bộ truy hồi, mà không có gì xảy ra.
    #
    # Bảy biến còn lại (`AI_MAX_TOKENS`, `AI_REASONING_EFFORT`, `AI_REQUEST_BUDGET_SECONDS`,
    # `AI_MAX_RETRY`, `RAG_TOP_K`, `AI_EMBEDDING_MODEL`, `LLM_RATE_LIMIT_FALLBACK_*`) chỉ là chết:
    # đặt hay không đặt đều không đổi gì. Biến chết mời người ta điều chỉnh một cái núm không nối
    # vào đâu, rồi kết luận sai về hệ thống khi không thấy tác dụng.
    #
    # Danh sách dưới đối chiếu được: `ai/app/test_packaging.py` bắt mọi biến compose truyền mà không
    # mô-đun nào đọc, và ngược lại.
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:20128/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-cx/gpt-5.6-luna-review}
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?AI_INTERNAL_TOKEN is required}
      # Đường SINH: mô hình VIẾT chữ cho khách thay vì khuôn mẫu dựng.  Mặc định TẮT, và mặc
      # định đó dựa trên số đo, không dựa trên thận trọng chung: trên 18 ca loại C, câu sinh
      # làm TỤT 9 ca so với đường tất định (thua thước đo nội dung: văn xuôi nêu 3 món trong
      # khi khuôn mẫu nêu 6), mô hình bịa giá ở 3/18 lượt (lớp xác minh chặn được), và độ trễ
      # là 7 giây mỗi lượt so với gần 0.
      #
      # Bật nó là một quyết định phải xem những con số đó trước.  Xem
      # ai/evaluation/run_llm_rag_eval.py để chạy lại phép đo.
      AI_ENABLE_GENERATION: ${AI_ENABLE_GENERATION:-}
      # 30 giây, và phải NHỎ HƠN `BACKEND_AI_TIMEOUT_SECONDS` (50) ở trên: backend phải còn thời
      # gian nhận câu thoái hóa của dịch vụ AI thay vì tự hết hạn trước và trả lỗi cho khách.
      # `DeploymentConfigurationTests` canh đúng quan hệ đó.
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      # Giới hạn số luồng CPU của torch. Đây là biến DUY NHẤT còn lại trong nhóm "điều chỉnh hiệu
      # năng", và nó thật: mô hình embedding chạy trên CPU cùng máy với backend và Postgres.
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-4}
      AI_SERVICE_HOST: ${AI_SERVICE_HOST:-127.0.0.1}
      AI_SERVICE_PORT: ${AI_SERVICE_PORT:-8001}
    mem_limit: 3g
    network_mode: host
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:${AI_SERVICE_PORT:-8001}/ready', timeout=3); exit(0 if b'ready' in r.read() else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  frontend:
    image: ${FRONTEND_IMAGE:-cmc-restaurant-frontend:${DEPLOY_ENV:-local}}
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_BASE_URL:-https://api.cmcrestaurant.app/api}
        VITE_ORDER_HUB_URL: ${PUBLIC_ORDER_HUB_URL:-https://api.cmcrestaurant.app/hubs/orders}
        VITE_ORDERING_BASE_URL: ${PUBLIC_ORDERING_BASE_URL:-https://order.cmcrestaurant.app}
        VITE_MARKETING_BASE_URL: ${PUBLIC_MARKETING_BASE_URL:-https://cmcrestaurant.app}
        VITE_USE_MOCK_CHAT: ${VITE_USE_MOCK_CHAT:-false}
        VITE_USE_MOCK_ORDER: ${VITE_USE_MOCK_ORDER:-false}
        VITE_USE_MOCK_MENU: ${VITE_USE_MOCK_MENU:-false}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
