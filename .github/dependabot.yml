version: 2
updates:
  # GitHub Actions used across all workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci

  # .NET backend (solution-level restore)
  - package-ecosystem: nuget
    directory: "/backend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend

  # Frontend monorepo (npm workspaces)
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    groups:
      # Batch low-risk dev/test tooling to reduce PR noise.
      dev-tooling:
        patterns:
          - "@types/*"
          - "vitest"
          - "@vitejs/*"
          - "typescript"

  # Python AI/RAG service
  - package-ecosystem: pip
    directory: "/ai"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ai
