name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  release-checks:
    name: release-checks
    uses: ./.github/workflows/ci.yml

  deploy:
    name: deploy-production
    runs-on: ubuntu-latest
    needs:
      - release-checks
    environment: production
    env:
      DEPLOY_ENV: production
      SSH_HOST: ${{ secrets.PRODUCTION_HOST }}
      SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
      SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
      COMPOSE_PROJECT_NAME: cmc-restaurant-production
      FRONTEND_PORT: "8080"
      BACKEND_PORT: "5000"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: restaurant_qr
      POSTGRES_USER: restaurant_user
      POSTGRES_PASSWORD: ${{ secrets.PRODUCTION_POSTGRES_PASSWORD }}
      FRONTEND_SERVER_NAMES: cmcrestaurant.app order.cmcrestaurant.app admin.cmcrestaurant.app staff.cmcrestaurant.app kitchen.cmcrestaurant.app
      API_SERVER_NAME: api.cmcrestaurant.app
      PUBLIC_API_BASE_URL: https://api.cmcrestaurant.app/api
      PUBLIC_ORDERING_BASE_URL: https://order.cmcrestaurant.app
      PUBLIC_MARKETING_BASE_URL: https://cmcrestaurant.app
      CORS_ALLOWED_ORIGINS: https://cmcrestaurant.app;https://order.cmcrestaurant.app;https://admin.cmcrestaurant.app;https://staff.cmcrestaurant.app;https://kitchen.cmcrestaurant.app
      ASPNETCORE_ENVIRONMENT: Production
      JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
      PAYMENTS__VIETQR__BANKID: ${{ secrets.PAYMENTS__VIETQR__BANKID }}
      PAYMENTS__VIETQR__ACCOUNTNUMBER: ${{ secrets.PAYMENTS__VIETQR__ACCOUNTNUMBER }}
      PAYMENTS__VIETQR__ACCOUNTNAME: ${{ secrets.PAYMENTS__VIETQR__ACCOUNTNAME }}
      PAYMENTS__VIETQR__TEMPLATE: ${{ secrets.PAYMENTS__VIETQR__TEMPLATE }}
      RUN_DB_MIGRATIONS_ON_STARTUP: "false"
      AI_PROVIDER: python-rag
      AI_SERVICE_URL: http://127.0.0.1:8002
      AI_SERVICE_PORT: "8002"
      AI_LLM_PROVIDER: 9router
      AI_BASE_URL: http://127.0.0.1:20128/v1
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      AI_MODEL: ${{ vars.AI_MODEL || 'gh/gemini-3.1-pro-preview' }}
      RAG_TOP_K: "5"
      CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL || '' }}
      BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.PRODUCTION_BOOTSTRAP_ADMIN_EMAIL }}
      BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.PRODUCTION_BOOTSTRAP_ADMIN_PASSWORD }}
      SEED_DEMO_USERS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to production VPS
        run: bash deploy/scripts/deploy-vps.sh

      - name: Auto-rollback on failed deploy
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::warning::Production deploy failed (build/migration/health-check). Dispatching rollback."
          gh workflow run rollback.yml -f environment=production
          echo "Rollback workflow dispatched for production. Investigate the failed run before re-deploying."

      - name: Deployment summary
        run: |
          {
            echo "## Production deployment"
            echo "- Frontend: https://cmcrestaurant.app"
            echo "- Table ordering: https://order.cmcrestaurant.app"
            echo "- Admin alias: https://admin.cmcrestaurant.app"
            echo "- Staff portal: https://staff.cmcrestaurant.app"
            echo "- Kitchen board: https://kitchen.cmcrestaurant.app"
            echo "- API health: https://api.cmcrestaurant.app/api/health"
            echo "- Result: workflow reached post-deploy summary"
          } >> "$GITHUB_STEP_SUMMARY"
