name: Rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to roll back
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

# CÙNG nhóm khóa với deploy của chính môi trường đó.
#
# `deploy-staging` dùng `group: deploy-staging`, `deploy-production` dùng `group: deploy-production`.
# Rollback trước đây KHÔNG thuộc nhóm nào, nên nó chạy song song được với một lần deploy — và cả hai
# đều `ssh` vào `/opt/cmc-restaurant/<env>` rồi `docker compose up`.
#
# Điều làm chỗ này nguy hiểm chứ không chỉ là thiếu sót lý thuyết: rollback được gọi **TỰ ĐỘNG**.
# `deploy-production.yml` có bước `if: failure()` chạy `gh workflow run rollback.yml`. Nên kịch bản
# hai tiến trình cùng sửa một thư mục không cần ai bấm nhầm — chỉ cần một lần deploy đỏ đúng lúc có
# một lần deploy khác đang chạy.
#
# `cancel-in-progress: false`: một lần rollback ĐANG chạy dở không được hủy giữa chừng, vì nó đang
# đổi trạng thái trên máy thật.
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  rollback:
    name: rollback-${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      DEPLOY_ENV: ${{ inputs.environment }}
      SSH_HOST: ${{ inputs.environment == 'production' && secrets.PRODUCTION_HOST || secrets.STAGING_HOST }}
      SSH_USER: ${{ inputs.environment == 'production' && secrets.PRODUCTION_SSH_USER || secrets.STAGING_SSH_USER }}
      SSH_KEY: ${{ inputs.environment == 'production' && secrets.PRODUCTION_SSH_KEY || secrets.STAGING_SSH_KEY }}
      COMPOSE_PROJECT_NAME: ${{ inputs.environment == 'production' && 'cmc-restaurant-production' || 'cmc-restaurant-staging' }}
    steps:
      - name: Roll back on VPS
        run: |
          set -euo pipefail
          work_dir="$(mktemp -d)"
          trap 'rm -rf "$work_dir"' EXIT
          key_file="$work_dir/deploy_key"
          known_hosts_file="$work_dir/known_hosts"
          printf '%s\n' "$SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          ssh-keyscan -H "$SSH_HOST" > "$known_hosts_file" 2>/dev/null
          ssh -i "$key_file" -o UserKnownHostsFile="$known_hosts_file" -o StrictHostKeyChecking=yes "${SSH_USER}@${SSH_HOST}" \
            "cd /opt/cmc-restaurant/${DEPLOY_ENV} && DEPLOY_ENV='${DEPLOY_ENV}' COMPOSE_PROJECT_NAME='${COMPOSE_PROJECT_NAME}' bash repo/deploy/scripts/rollback-vps.sh"
