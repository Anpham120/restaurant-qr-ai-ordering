name: AI Research Reproduction

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai/requirements-research.txt

      - name: Install research dependencies
        run: python -m pip install -r ai/requirements-research.txt

      - name: Build dataset from the canonical 91-item menu
        env:
          PYTHONPATH: ai
        run: python ai/research/build_dataset.py

      - name: Run all retrieval methods on the locked protocol
        env:
          PYTHONPATH: ai
        run: python ai/research/run_experiments.py

      - name: Rebuild executed notebook from experiment artifacts
        env:
          MPLCONFIGDIR: /tmp/matplotlib
          PYTHONPATH: ai
        run: python ai/research/build_notebook.py

      - name: Verify runtime and artifact consistency
        env:
          PYTHONPATH: ai
        run: python -m unittest discover -s ai/tests -v

      - name: Upload evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: academic-rag-evidence
          path: |
            ai/notebooks/academic_retrieval_study.ipynb
            ai/research/menu_snapshot.json
            ai/research/queries.csv
            ai/research/artifacts/
          retention-days: 30
