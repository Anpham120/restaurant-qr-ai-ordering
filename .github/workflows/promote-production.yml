name: Promote Production

on:
  workflow_run:
    workflows:
      - Deploy Staging
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

# Workflow này FORCE-PUSH một nhánh dùng chung (`release/promote-develop-to-main`) rồi tạo/sửa một PR
# duy nhất. Nó chạy sau MỖI lần Deploy Staging xong, nên hai lần deploy gần nhau sinh ra hai tiến
# trình cùng ghi đè một nhánh và cùng thao tác trên một PR.
#
# `cancel-in-progress: true` ở đây là đúng, khác với các workflow deploy: lần chạy sau luôn mang
# `develop` MỚI HƠN, nên hủy lần cũ không mất gì — bản nó định đẩy đã lạc hậu. Ngược lại, một lần
# deploy bị hủy giữa chừng là để lại máy thật ở trạng thái dở.
concurrency:
  group: promote-production
  cancel-in-progress: true

jobs:
  open-release-pr:
    name: open-release-pr
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'develop') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Open or refresh the develop -> main release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}
          RELEASE_BRANCH: release/promote-develop-to-main
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git fetch origin main develop

          if git diff --quiet origin/main..origin/develop; then
            echo "No changes between develop and main; nothing to promote."
            exit 0
          fi

          git checkout -B "$RELEASE_BRANCH" origin/main
          git merge --no-ff --no-edit origin/develop
          git push --force-with-lease origin "$RELEASE_BRANCH"

          body=$'Automated release PR: staging deployment from `develop` passed.\n\n'
          body+=$'**Production is gated — this PR does NOT auto-merge.**\n'
          body+=$'A maintainer must review CI + staging, then merge manually.\n'
          body+=$'Merging to `main` triggers Deploy Production (with post-deploy health check and auto-rollback).'

          existing_pr="$(gh pr list --base main --head "$RELEASE_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$existing_pr" ]; then
            gh pr create \
              --base main \
              --head "$RELEASE_BRANCH" \
              --title "chore: promote develop to production" \
              --body "$body"
            echo "Release PR opened for manual review."
          else
            gh pr comment "$existing_pr" --body "Staging passed again; release PR refreshed and awaiting manual approval."
            echo "Release PR #${existing_pr} refreshed; awaiting manual approval."
          fi

          echo "::notice::Release PR is ready. Production deploys only after a human merges it to main."
