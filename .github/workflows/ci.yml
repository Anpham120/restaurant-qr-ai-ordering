name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main
      - "feat/**"
      - "fix/**"
      - "chore/**"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Cancel superseded runs on the same ref so pushes don't pile up runners.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend regression tests
        run: npm test

      - name: Build frontend
        run: npm run build

  backend-test:
    name: backend-test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_CONNECTION_STRING: Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore backend
        run: dotnet restore backend/RestaurantQrAiOrdering.sln

      - name: Build backend
        run: dotnet build backend/RestaurantQrAiOrdering.sln --configuration Release --no-restore

      - name: Run backend regression tests
        run: dotnet test backend/RestaurantQrAiOrdering.sln --configuration Release --no-restore

  ai-service-build:
    name: ai-service-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AI service dependencies
        run: python -m pip install -r ai/requirements.txt nbformat

      - name: Validate research notebook build contract
        env:
          PYTHONPATH: ai
        working-directory: ai
        run: python scripts/build_research_notebook.py

      - name: Compile Python service
        env:
          PYTHONPATH: ai
        run: python -m compileall -q ai/app

      - name: Run AI guardrail tests
        env:
          PYTHONPATH: ai
        run: python -m unittest discover -s ai/tests -v

      - name: Run reproducible RAG benchmark
        env:
          PYTHONPATH: ai
        run: python ai/evaluation/retrieval_benchmark.py

      - name: Run golden CI gates
        env:
          PYTHONPATH: ai
        run: python ai/evaluation/ci_golden_gates.py --run-smoke-eval

  docker-compose-config:
    name: docker-compose-config
    runs-on: ubuntu-latest
    env:
      DEPLOY_ENV: ci
      COMPOSE_PROJECT_NAME: cmc-restaurant-ci
      FRONTEND_PORT: "8080"
      BACKEND_PORT: "5000"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: restaurant_qr_ci
      POSTGRES_USER: restaurant_user
      POSTGRES_PASSWORD: ci-postgres-placeholder
      FRONTEND_SERVER_NAMES: cmcrestaurant.app order.cmcrestaurant.app admin.cmcrestaurant.app staff.cmcrestaurant.app kitchen.cmcrestaurant.app
      API_SERVER_NAME: api.cmcrestaurant.app
      PUBLIC_API_BASE_URL: https://api.cmcrestaurant.app/api
      PUBLIC_ORDERING_BASE_URL: https://order.cmcrestaurant.app
      PUBLIC_MARKETING_BASE_URL: https://cmcrestaurant.app
      JWT_SIGNING_KEY: ci-placeholder-signing-key-change-me
      CORS_ALLOWED_ORIGINS: https://cmcrestaurant.app;https://order.cmcrestaurant.app;https://admin.cmcrestaurant.app;https://staff.cmcrestaurant.app;https://kitchen.cmcrestaurant.app
      PAYMENTS__VIETQR__BANKID: "970436"
      PAYMENTS__VIETQR__ACCOUNTNUMBER: "ci-placeholder-account"
      PAYMENTS__VIETQR__ACCOUNTNAME: CMC CI
      CHAT_AI_PROVIDER: python-rag
      AI_SERVICE_URL: http://127.0.0.1:8001
      AI_SERVICE_PORT: "8001"
      AI_INTERNAL_TOKEN: ci-internal-token-placeholder
      LLM_PROVIDER: 9router
      LLM_BASE_URL: http://127.0.0.1:20128/v1
      LLM_API_KEY: ci-provider-key-placeholder
      LLM_MODEL: cx/gpt-5.5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose config
        run: docker compose -f deploy/docker-compose.yml config
