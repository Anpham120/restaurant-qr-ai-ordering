name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  backend-test:
    name: backend-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore backend
        run: dotnet restore backend/RestaurantQrAiOrdering.sln

      - name: Build backend
        run: dotnet build backend/RestaurantQrAiOrdering.sln --configuration Release --no-restore

      - name: Test backend
        run: dotnet test backend/RestaurantQrAiOrdering.sln --configuration Release --no-build --verbosity normal

  docker-compose-config:
    name: docker-compose-config
    runs-on: ubuntu-latest
    env:
      DEPLOY_ENV: ci
      COMPOSE_PROJECT_NAME: cmc-restaurant-ci
      FRONTEND_PORT: "8080"
      BACKEND_PORT: "5000"
      FRONTEND_SERVER_NAMES: cmcrestaurant.app
      API_SERVER_NAME: api.cmcrestaurant.app
      PUBLIC_API_BASE_URL: https://api.cmcrestaurant.app/api
      JWT_SIGNING_KEY: ci-placeholder-signing-key-change-me
      AI_BASE_URL: http://127.0.0.1:20128/v1
      AI_MODEL: 9router
      AI_API_KEY: ci-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose config
        run: docker compose -f deploy/docker-compose.yml config
