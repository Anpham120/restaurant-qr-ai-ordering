name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main
      - "feat/**"
      - "fix/**"
      - "chore/**"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Cancel superseded runs on the same ref so pushes don't pile up runners.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Test frontend
        run: npx vitest run --reporter=default --reporter=junit --outputFile=test-results/frontend-junit.xml

      - name: Upload frontend test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test-results
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14

  backend-test:
    name: backend-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore backend
        run: dotnet restore backend/RestaurantQrAiOrdering.sln

      - name: Build backend
        run: dotnet build backend/RestaurantQrAiOrdering.sln --configuration Release --no-restore

      - name: Test backend
        run: >-
          dotnet test backend/RestaurantQrAiOrdering.sln
          --configuration Release --no-build --verbosity normal
          --logger "trx;LogFileName=backend-tests.trx"
          --results-directory TestResults

      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: TestResults/
          if-no-files-found: ignore
          retention-days: 14

  ai-service-test:
    name: ai-service-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AI service dependencies
        run: python -m pip install -r ai/requirements.txt

      - name: Test Python RAG core
        env:
          PYTHONPATH: ai
        run: python -m unittest discover -s ai/tests

  docker-compose-config:
    name: docker-compose-config
    runs-on: ubuntu-latest
    env:
      DEPLOY_ENV: ci
      COMPOSE_PROJECT_NAME: cmc-restaurant-ci
      FRONTEND_PORT: "8080"
      BACKEND_PORT: "5000"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: restaurant_qr_ci
      POSTGRES_USER: restaurant_user
      POSTGRES_PASSWORD: ci-postgres-placeholder
      FRONTEND_SERVER_NAMES: cmcrestaurant.app
      API_SERVER_NAME: api.cmcrestaurant.app
      PUBLIC_API_BASE_URL: https://api.cmcrestaurant.app/api
      JWT_SIGNING_KEY: ci-placeholder-signing-key-change-me
      AI_PROVIDER: python-rag
      AI_SERVICE_URL: http://127.0.0.1:8001
      AI_SERVICE_PORT: "8001"
      AI_LLM_PROVIDER: 9router
      AI_BASE_URL: http://127.0.0.1:20128/v1
      AI_MODEL: gh/gemini-3.1-pro-preview
      AI_API_KEY: ci-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose config
        run: docker compose -f deploy/docker-compose.yml config
