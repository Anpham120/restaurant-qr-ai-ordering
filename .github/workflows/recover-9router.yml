name: Recover 9router

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type RESTART_9ROUTER to restart only the verified router service.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: recover-9router
  cancel-in-progress: false

jobs:
  recover:
    # A restart changes VPS state, so it is both manually dispatched and
    # explicitly confirmed.  The target is the unit identified by the
    # read-only router-origin probe, never a caller-provided shell value.
    if: inputs.confirm == 'RESTART_9ROUTER'
    runs-on: ubuntu-latest
    environment: staging
    env:
      SSH_HOST: ${{ secrets.STAGING_HOST }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
    steps:
      - name: Restart verified 9router service
        run: |
          router_dir="$(mktemp -d)"
          key_file="${router_dir}/deploy-key"
          known_hosts_file="${router_dir}/known-hosts"
          trap 'rm -rf -- "$router_dir"' EXIT
          printf '%s\n' "$SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          ssh-keyscan -H "$SSH_HOST" > "$known_hosts_file" 2>/dev/null
          ssh \
            -i "$key_file" \
            -o UserKnownHostsFile="$known_hosts_file" \
            -o StrictHostKeyChecking=yes \
            "${SSH_USER}@${SSH_HOST}" \
            'set -eu
            sudo -n systemctl restart 9router.service
            for attempt in $(seq 1 30); do
              if systemctl is-active --quiet 9router.service && ss -ltnH | grep -q ":20128"; then
                echo "9router listener is ready"
                exit 0
              fi
              sleep 1
            done
            service_state="$(sudo -n systemctl show 9router.service \
              -p ActiveState -p SubState -p ExecMainCode -p ExecMainStatus \
              --no-pager)"
            printf "9router service state=%s\\n" "$service_state"
            router_process_listeners="$(sudo -n ss -ltnp | grep -Ei "9router|router" || true)"
            if [ -n "$router_process_listeners" ]; then
              printf "9router process listeners=%s\\n" "$router_process_listeners"
            else
              echo "9router process listeners=none"
            fi
            echo "9router listener did not become ready" >&2
            exit 1'
