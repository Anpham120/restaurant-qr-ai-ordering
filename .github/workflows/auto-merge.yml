name: Auto Merge

on:
  pull_request_target:
    # `develop` VÀ `main`. Trước đây chỉ có `develop`, với lý do "đưa lên production phải là một
    # bước người duyệt có chủ ý" — nhưng trên thực tế bước đó chỉ còn là bấm một nút trên một PR mà
    # 13 phép kiểm và một lần deploy staging đã xanh. Một nút mà lần nào cũng bấm thì không phải
    # chốt an toàn, nó là ma sát.
    #
    # Chốt được giữ lại ở ĐÚNG chỗ nó còn nghĩa: PR đụng migration cơ sở dữ liệu (xem bước dưới).
    branches:
      - develop
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    name: enable-auto-merge
    runs-on: ubuntu-latest
    # Never auto-merge draft PRs or PRs opened from forks (pull_request_target
    # runs with base-repo secrets, so restrict to same-repo branches).
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # MIGRATION LÊN PRODUCTION THÌ DỪNG LẠI CHỜ NGƯỜI.
      #
      # Vì sao đúng chỗ này mà không phải chỗ khác: mọi thứ khác trong PR đều hoàn tác được bằng một
      # lần deploy lại — mã sai thì đẩy bản sửa, cấu hình sai thì đổi biến. Migration thì không: nó
      # đổi dữ liệu THẬT trong cơ sở dữ liệu, và `Down()` chỉ chạy khi có người chủ động chạy nó.
      #
      # Repo này vừa sửa xong một lỗi đúng loại đó — `Down()` của hai phiên bản nhãn trước lùi về
      # nhãn seed tháng 7 thay vì về phiên bản liền trước, và không ai thấy vì không đường chạy nào
      # gọi `Down()`. Một bước người ở đây là chỗ rẻ nhất để bắt lớp lỗi ấy.
      #
      # Chỉ chặn khi base là `main`: PR vào `develop` vẫn tự merge, vì staging không phải dữ liệu
      # khách.
      - name: Kiểm PR có đụng migration không
        id: migration
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          if [ "$BASE" != "main" ]; then
            echo "base=$BASE, không phải production — không cần kiểm migration."
            echo "chan=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # `|| true` vì `grep -q` trả 1 khi không khớp, và `set -e` sẽ giết bước.
          FILES="$(gh pr diff "$PR_URL" --name-only || true)"
          if printf '%s\n' "$FILES" | grep -q 'Data/Migrations/'; then
            echo "chan=true" >> "$GITHUB_OUTPUT"
            echo "PR này đụng migration cơ sở dữ liệu:"
            printf '%s\n' "$FILES" | grep 'Data/Migrations/' | sed 's/^/  - /'
          else
            echo "chan=false" >> "$GITHUB_OUTPUT"
            echo "Không đụng migration."
          fi

      - name: Nói rõ vì sao KHÔNG bật auto-merge
        if: steps.migration.outputs.chan == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          # Bình luận thay vì im lặng: một PR không tự merge mà không nói lý do thì người ta ngồi
          # chờ. Cùng nguyên tắc với việc hệ thống phải NÓI RA khi nó bỏ một ràng buộc.
          #
          # Soạn bằng `printf` ra tệp rồi `--body-file`, KHÔNG dùng heredoc: heredoc lồng trong
          # block scalar của YAML phải thụt lề theo khối, mà dấu kết thúc `EOF` thì lại không được
          # thụt — hai đòi hỏi mâu thuẫn. Bản đầu viết vậy và YAML hỏng ngay.
          {
            printf '**Auto-merge KHÔNG được bật cho PR này** — nó đụng migration cơ sở dữ liệu.\n\n'
            printf 'Mọi thứ khác trong một PR đều hoàn tác được bằng một lần deploy lại. Migration '
            printf 'thì không: nó đổi dữ liệu THẬT, và `Down()` chỉ chạy khi có người chủ động '
            printf 'chạy nó.\n\n'
            printf 'Kiểm rồi bấm **Merge** khi thấy ổn. Muốn xem trước nó làm gì thì đọc `Up()` và '
            printf '`Down()` trong tệp `Data/Migrations/` của PR.\n'
          } > /tmp/auto-merge-body.md
          gh pr comment "$PR_URL" --body-file /tmp/auto-merge-body.md \
            || echo "Không bình luận được (không chặn bước sau)."

      - name: Enable auto-merge for eligible PR
        if: steps.migration.outputs.chan != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          if gh pr merge "$PR_URL" --auto --merge; then
            echo "Auto-merge enabled for $PR_URL"
          else
            echo "Auto-merge could not be enabled automatically."
            echo "Check repository setting: allow auto-merge, required checks, and merge queue/ruleset."
          fi
