name: Auto Merge

on:
  pull_request_target:
    # Only PRs targeting develop merge automatically. Promotion to main
    # (production) stays a deliberate, manually-approved step.
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    name: enable-auto-merge
    runs-on: ubuntu-latest
    # Never auto-merge draft PRs or PRs opened from forks (pull_request_target
    # runs with base-repo secrets, so restrict to same-repo branches).
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Enable auto-merge for eligible PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          if gh pr merge "$PR_URL" --auto --merge; then
            echo "Auto-merge enabled for $PR_URL"
          else
            echo "Auto-merge could not be enabled automatically."
            echo "Check repository setting: allow auto-merge, required checks, and merge queue/ruleset."
          fi
