map $host $cmc_app_root {
  default /usr/share/nginx/html/customer;
  cmcrestaurant.app /usr/share/nginx/html/customer;
  customer.cmcrestaurant.app /usr/share/nginx/html/customer;
  staging.cmcrestaurant.app /usr/share/nginx/html/customer;
  admin.cmcrestaurant.app /usr/share/nginx/html/admin;
  kitchen.cmcrestaurant.app /usr/share/nginx/html/kitchen;
  staff.cmcrestaurant.app /usr/share/nginx/html/staff;
}

server {
  listen 80;
  server_name _;

  root $cmc_app_root;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /health {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }
}
