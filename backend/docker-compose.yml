services:
  postgres:
    image: postgres:16-alpine
    container_name: restaurant-postgres
    environment:
      POSTGRES_DB: restaurant_qr
      POSTGRES_USER: restaurant_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurant_user -d restaurant_qr"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: restaurant-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=restaurant_qr;Username=restaurant_user;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - Jwt__SigningKey=${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      - Payments__VietQr__BankId=${PAYMENTS__VIETQR__BANKID:?PAYMENTS__VIETQR__BANKID is required}
      - Payments__VietQr__AccountNumber=${PAYMENTS__VIETQR__ACCOUNTNUMBER:?PAYMENTS__VIETQR__ACCOUNTNUMBER is required}
      - Payments__VietQr__AccountName=${PAYMENTS__VIETQR__ACCOUNTNAME:?PAYMENTS__VIETQR__ACCOUNTNAME is required}
      - Payments__VietQr__Template=${PAYMENTS__VIETQR__TEMPLATE:-compact2}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
